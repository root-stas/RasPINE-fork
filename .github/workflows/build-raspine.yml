name: Build RasPINE Image

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      kiosk_enabled:
        type: boolean
        description: 'Enable kiosk mode'
        required: false
        default: false
      alpine_arch:
        description: 'Build OS architecture'
        required: true
        default: 'armhf'
        type: choice
        options:
          - armhf
          - aarch64
      alpine_version:
        description: 'Alpine version to build for'
        required: true
        default: '3.22'
        type: choice
        options:
          - '3.22'
          - '3.23'

env:
  ALPINE_VERSION: "${{ inputs.alpine_version }}"
  ALPINE_ARCH: "${{ inputs.alpine_arch }}"
  ALPINE_KIOSK: "${{ inputs.kiosk_enabled }}"
  IMAGE_SIZE: "1500M"
  BOOT_SIZE: "256M"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      build_date: ${{ steps.set-date.outputs.date }}
      image_name: ${{ steps.set-date.outputs.image_name }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set build date
      id: set-date
      run: |
        BUILD_DATE=$(date +'%Y-%m-%d')
        echo "date=$BUILD_DATE" >> $GITHUB_OUTPUT
        echo "image_name=RasPINE-$BUILD_DATE.img.xz" >> $GITHUB_OUTPUT
        echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          qemu-user-static \
          binfmt-support \
          parted \
          kpartx \
          dosfstools \
          e2fsprogs \
          wget \
          curl \
          xz-utils \
          fdisk \
          util-linux \
          rsync \
          git \
          jq \
          coreutils

    - name: Set up QEMU for ARM emulation
      run: |
        sudo update-binfmts --display
        sudo update-binfmts --enable qemu-arm
        sudo update-binfmts --enable qemu-aarch64

    - name: Create empty image
      run: |
        echo "Creating ${IMAGE_SIZE} image..."
        truncate -s ${IMAGE_SIZE} raspine.img
        
        # Create partitions
        parted -s raspine.img \
          mklabel msdos \
          mkpart primary fat32 1MiB ${BOOT_SIZE} \
          mkpart primary ext4 ${BOOT_SIZE} 100% \
          set 1 boot on

    - name: Set up loop device and format partitions
      run: |
        # Set up loop device with partitions
        sudo losetup -P /dev/loop0 raspine.img
        
        # Format partitions
        echo "Formatting boot partition..."
        sudo mkfs.vfat -F 32 -n BOOT /dev/loop0p1
        
        echo "Formatting root partition..."
        sudo mkfs.ext4 -L rootfs /dev/loop0p2
        
        # Mount partitions
        sudo mkdir -p /mnt/{boot,root}
        sudo mount /dev/loop0p1 /mnt/boot
        sudo mount /dev/loop0p2 /mnt/root

    - name: Install Alpine Linux rootfs
      run: |
        ALPINE_MIRROR="https://dl-cdn.alpinelinux.org/alpine/v${ALPINE_VERSION}"
        
        echo "Searching for Alpine rootfs files..."
        echo "Looking in: ${ALPINE_MIRROR}/releases/${ALPINE_ARCH}/"
        
        # Get the actual filename - simplified pattern
        ALPINE_FILE=$(curl -s "${ALPINE_MIRROR}/releases/${ALPINE_ARCH}/" | \
                      grep -o 'alpine-minirootfs[^"<]*\.tar\.gz' | \
                      grep "${ALPINE_VERSION}" | \
                      head -1)
        
        # If that didn't work, try another approach
        if [ -z "$ALPINE_FILE" ]; then
          echo "First attempt failed, trying alternate method..."
          ALPINE_FILE=$(curl -s "${ALPINE_MIRROR}/releases/${ALPINE_ARCH}/" | \
                        sed -n 's/.*href="\(alpine-minirootfs-[^"]*\.tar\.gz\).*/\1/p' | \
                        grep "${ALPINE_VERSION}" | \
                        head -1)
        fi
        
        # If still nothing, build the filename from known pattern
        if [ -z "$ALPINE_FILE" ]; then
          echo "Dynamic detection failed, building filename..."
          # Get latest patch version for this minor version
          PATCH_VERSION=$(curl -s "${ALPINE_MIRROR}/releases/${ALPINE_ARCH}/" | \
                          grep -o "alpine-minirootfs-${ALPINE_VERSION}\.[0-9]*-${ALPINE_ARCH}\.tar\.gz" | \
                          sed "s/.*-${ALPINE_VERSION}\.\([0-9]*\)-.*/\1/" | \
                          sort -n | tail -1)
          if [ -n "$PATCH_VERSION" ]; then
            ALPINE_FILE="alpine-minirootfs-${ALPINE_VERSION}.${PATCH_VERSION}-${ALPINE_ARCH}.tar.gz"
          else
            ALPINE_FILE="alpine-minirootfs-${ALPINE_VERSION}.0-${ALPINE_ARCH}.tar.gz"
          fi
        fi
        
        echo "Found Alpine rootfs: ${ALPINE_FILE}"
        FULL_URL="${ALPINE_MIRROR}/releases/${ALPINE_ARCH}/${ALPINE_FILE}"
        echo "Downloading from: ${FULL_URL}"
        
        # Download with curl
        curl -L -f -o "${ALPINE_FILE}" "${FULL_URL}" || {
          echo "Download failed! Let's check if the file exists:"
          curl -I "${FULL_URL}"
          exit 1
        }
        
        # Verify download
        if [ ! -f "${ALPINE_FILE}" ]; then
          echo "ERROR: Download failed - file not found"
          exit 1
        fi
        
        FILE_SIZE=$(du -h "${ALPINE_FILE}" | cut -f1)
        echo "Downloaded successfully: ${ALPINE_FILE} (${FILE_SIZE})"
        
        # Extract Alpine rootfs
        echo "Extracting Alpine rootfs to /mnt/root/..."
        sudo tar -xzf "${ALPINE_FILE}" -C /mnt/root/
        
        # Copy QEMU static binary for chroot
        echo "Setting up QEMU for ARM emulation..."
        sudo cp /usr/bin/qemu-arm-static /mnt/root/usr/bin/
        
        echo "✓ Alpine rootfs installation complete"

    - name: Configure Alpine base system with user support and RasPINE repo
      run: |
        # Copy DNS configuration into chroot
        echo "Setting up DNS for chroot..."
        sudo cp /etc/resolv.conf /mnt/root/etc/resolv.conf
        
        # Pass environment variables to the chroot
        sudo tee /mnt/root/etc/alpine-build-env << ENV_EOF
        export ALPINE_VERSION="${ALPINE_VERSION}"
        export ALPINE_ARCH="${ALPINE_ARCH}"
        export ALPINE_KIOSK="${ALPINE_KIOSK}"
        ENV_EOF
        
        # Also mount necessary filesystems for chroot
        sudo mount -t proc none /mnt/root/proc
        sudo mount -t sysfs none /mnt/root/sys
        sudo mount -o bind /dev /mnt/root/dev
        sudo mount -o bind /dev/pts /mnt/root/dev/pts || true
        
        cat << 'EOF' | sudo tee /mnt/root/setup-alpine.sh
        #!/bin/sh
        set -e
        
        # Source the environment variables
        . /etc/alpine-build-env
        
        # Ensure DNS is working
        echo "Testing DNS resolution..."
        nslookup dl-cdn.alpinelinux.org || {
          echo "DNS not working, using Google DNS..."
          echo "nameserver 8.8.8.8" > /etc/resolv.conf
          echo "nameserver 8.8.4.4" >> /etc/resolv.conf
        }
        
        # Set up Alpine repositories
        echo "Setting up Alpine ${ALPINE_VERSION} repositories..."
        cat > /etc/apk/repositories << REPOS
        https://dl-cdn.alpinelinux.org/alpine/v${ALPINE_VERSION}/main
        https://dl-cdn.alpinelinux.org/alpine/v${ALPINE_VERSION}/community
        REPOS
        
        # Update package index
        echo "Updating package index..."
        apk update
        
        # Install base packages plus WiFi support, sudo, ...
        echo "Installing packages..."
        apk add --no-cache \
          alpine-base \
          linux-rpi \
          raspberrypi-bootloader \
          raspberrypi-bootloader-cutdown \
          openrc \
          util-linux \
          e2fsprogs \
          dropbear \
          openssh-sftp-server \
          libc6-compat \
          wireless-tools \
          iw \
          dbus \
          iwd \
          ca-certificates \
          ca-certificates-bundle \
          openssl \
          sudo \
          tzdata \
          nano \
          htop \
          unzip \
          python3 \
          wireless-regdb \
          py3-rpigpio \
          i2c-tools
        
        if [ "${ALPINE_KIOSK}" == "true" ]; then
        echo "Installing kiosk packages..."
        apk add --no-cache alpine-conf
        setup-wayland-base
        apk add --no-cache chromium squeekboar sway wmenu foot swaybg swaybar xwayland mesa-dri-gallium mesa-vulkan-broadcom mesa-egl font-dejavu ttf-freefont greetd
        rc-update add greetd default
        
        echo "Config run files..."
        cat > /usr/local/bin/sway-run << SWAYEOF
        #!/bin/sh
        export XDG_SESSION_TYPE=wayland
        export XDG_SESSION_DESKTOP=sway
        export XDG_CURRENT_DESKTOP=sway
        export MOZ_ENABLE_WAYLAND=1
        export QT_QPA_PLATFORM=wayland
        export SDL_VIDEODRIVER=wayland
        export _JAVA_AWT_WM_NONREPARENTING=1
        exec dbus-run-session sway
        SWAYEOF
        chmod +x /usr/local/bin/sway-run
        
        echo "Config greetd files..."
        mkdir -p /etc/greetd/
        cat > /etc/greetd/config.toml << GRET_EOF
        [terminal]
        vt = 1
        [default_session]
        command = "/usr/local/bin/sway-run"
        user = "cfpp-100ac"
        GRET_EOF
        
        echo "Config sway files..."
        echo "output DSI-2 transform 90" | sudo tee -a /etc/sway/config > /dev/null
        echo "input 9271:1070:11-005d_Goodix_Capacitive_TouchScreen map_to_output DSI-2" | sudo tee -a /etc/sway/config > /dev/null
        echo ”exec_always squeekboar” | sudo tee -a /etc/sway/config > /dev/null
        echo "exec_always chromium --enable-features=UseOzonePlatform --ozone-platform=wayland --kiosk --no-first-run \\
          --disable-infobars --disable-session-crashed-bubble --disable-component-update --disable-pinch --app=http://127.0.0.1/ \\
          --no-sandbox --enable-zero-copy" | sudo tee -a /etc/sway/config > /dev/null
        fi
        
        # Fix the mkinitfs trigger error by creating the directory/file it expects
        #mkdir -p /boot
        #touch /boot/initramfs 2>/dev/null || true
        
        # Update CA certificates to fix SSL/TLS issues
        echo "Updating CA certificates..."
        update-ca-certificates
        
        # Add iw ap0
        cat > /etc/init.d/iwap << IWD
        #!/sbin/openrc-run
        
        description="Add AP wlan"
        
        depend() {
         use logger network
         after bootmisc modules network
         before iwd
        }
        
        start() {
         iw dev wlan0 interface add ap0 type __ap
         ip link set dev ap0 address b8:27:eb:00:00:00
        }
        IWD
        chmod +x /etc/init.d/iwap
        
        # Set up essential services
        echo "Configuring services..."
        rc-update add devfs sysinit
        rc-update add dmesg sysinit
        rc-update add mdev sysinit
        rc-update add modules boot
        rc-update add sysctl boot
        rc-update add hostname boot
        rc-update add bootmisc boot
        rc-update add hwclock boot
        rc-update add syslog boot
        rc-update add crond default
        rc-update add networking boot
        rc-update add iwap boot
        rc-update add iwd boot
        rc-update add dropbear default
        
        # Configure hostname
        echo "cfpp-100ac" > /etc/hostname
        
        # Configure hosts file
        cat > /etc/hosts << HOSTS
        127.0.0.1   cfpp-100ac localhost localhost.localdomain
        ::1   cfpp-100ac localhost localhost.localdomain
        HOSTS
        
        # Create cfpp-100ac user with sudo access
        echo "Creating cfpp-100ac user..."
        adduser -D -s /bin/sh cfpp-100ac
        addgroup cfpp-100ac wheel
        addgroup cfpp-100ac video
        addgroup cfpp-100ac input
        echo "cfpp-100ac:12345678" | chpasswd
        
        # Configure sudo for wheel group (passwordless)
        echo "%wheel ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/wheel
        
        # Disable root password login (can still sudo)
        echo "root:12345678" | chpasswd
        
        # Configure SSH - key only by default
        mkdir -p /etc/conf.d
        echo 'DROPBEAR_OPTS="-B"' > /etc/conf.d/dropbear

        echo 'net.ipv6.conf.all.disable_ipv6 = 1' >> /etc/sysctl.conf
        echo 'net.ipv6.conf.default.disable_ipv6 = 1' >> /etc/sysctl.conf
        echo 'net.ipv6.conf.lo.disable_ipv6 = 1' >> /etc/sysctl.conf

        ln -sf /usr/share/zoneinfo/Europe/Kyiv /etc/localtime
        
        # Set iwd cfg
        cat > /etc/iwd/main.conf << IWDCONF
        [General]
        
        EnableNetworkConfiguration=true
        UseDefaultInterface=true
        Country=US
        
        [Network]
        
        EnableIPv6=false

        [Scan]
        
        DisablePeriodicScan=true
        DisableRoamingScan=true
        
        [Rank]
        
        BandModifier2_4GHz=1.0
        BandModifier5GHz=0.0
        BandModifier6GHz=0.0
        IWDCONF
        
        # Set uap0
        mkdir -p /var/lib/iwd/ap
        cat > /var/lib/iwd/ap/CFPP-100AC.ap << APCONF
        [General]
        DisableHT=true
        Channel=11
        
        [Security]
        Passphrase=12345678
        
        [IPv4]
        Address=192.168.11.106
        Gateway=192.167.11.106
        Netmask=255.255.255.0
        IPRange=192.168.11.1,192.168.11.100
        APCONF
        
        # Add some fixes to /etc/mdev.conf to fix permissions for i2c,spi,ttyAMA0 etc.
        sed -i '/# fallback for any!device/i\# Allow Dialout to use /dev/ttyAMA[0-9]\nttyAMA[0-9]*        root:dialout 0660\n\n# For I2C devices\ni2c-[0-9]*          root:dialout 0660\n\n# For SPI devices\nspidev[0-9].[0-9]   root:dialout 0660\n' /etc/mdev.conf
        
        # Create necessary directories
        mkdir -p /boot/cfpp-100ac
        mkdir -p /var/log
        mkdir -p /usr/local/bin
        mkdir -p /run/user
        
        # Create autostart sh file
        cat > /boot/cfpp-100ac/startup.sh << ASF
        #!/bin/sh
        # Sync RTC clock
        hwclock -s
        
        # restart lo to localhost
        rc-service networking restart
        
        fw=/boot/cfpp-100ac/update.zip
        
        rm -r -f /boot/cfpp-100ac/__*
        rm -f /boot/cfpp-100ac/.DS_Store
        rm -r -f /boot/cfpp-100ac/._*
        rm -r -f /boot/cfpp-100ac/www/._*
        rm -r -f /boot/cfpp-100ac/www/locale/._*
        rm -r -f /boot/cfpp-100ac/www/fonts/._*
        rm -r -f /var/lib/iwd/*.psk
        rm -r -f /var/lib/iwd/ap/*.ap
        
        if [ -e "\$fw" ]; then
            rm -r -f /boot/cfpp-100ac/www
            unzip -o "\$fw" -d /boot/cfpp-100ac/
            rm -f "\$fw"
            rm -f /boot/cfpp-100ac/config.json
            reboot &
            exit 0
        fi
        
        #/usr/bin/python3 /boot/cfpp-100ac/main.py &
        export TMPDIR=/run
        /boot/cfpp-100ac/firmware.bin &
        exit 0
        ASF
        
        #echo -e  "@reboot sleep 1; sh /boot/cfpp-100ac/startup.sh" | sudo crontab -u root -
        # Set cron task
        cat > /etc/crontabs/root << CRCONF
        @reboot sleep 1; sh /boot/cfpp-100ac/startup.sh
        CRCONF
        
        # Create home directory structure for cfpp-100ac
        mkdir -p /home/cfpp-100ac
        chown cfpp-100ac:cfpp-100ac /home/cfpp-100ac
        
        # Add Broadcom WiFi modules to load at boot
        echo "Adding WiFi spi/i2c modules to auto-load..."
        cat >> /etc/modules << MODULES
        # Broadcom WiFi spi/i2c support for Raspberry Pi
        brcmfmac
        brcmutil
        cfg80211
        rfkill
        i2c-dev
        spidev
        rtc-ds1307
        vc4
        v3d
        MODULES
        
        # Create modprobe configuration for brcmfmac
        mkdir -p /etc/modprobe.d
        cat > /etc/modprobe.d/raspi-wifi.conf << MODCONF
        # Raspberry Pi WiFi configuration
        options brcmfmac roamoff=1
        # Disable power management for better stability
        options brcmfmac feature_disable=0x82000
        MODCONF
        
        # Set regulatory domain
        cat > /etc/modprobe.d/cfg80211.conf << REGCONF
        # Set regulatory domain
        options cfg80211 ieee80211_regdom=US
        REGCONF
        
        # Fix rfkill configuration
        cat > /etc/modprobe.d/rfkill_default.conf << RFKILLCONF
        # RasPINE rfkill configuration
        # default_state=1 means radios are UNBLOCKED by default
        options rfkill default_state=1 master_switch_mode=2
        RFKILLCONF
        
        # Cleanup the initramfs file we created
        #rm -f /boot/initramfs 2>/dev/null || true
        
        echo "Alpine ${ALPINE_VERSION} configuration complete!"
        EOF
        
        # Make script executable and run it
        sudo chmod +x /mnt/root/setup-alpine.sh
        sudo chroot /mnt/root /setup-alpine.sh
        
        # Cleanup
        sudo rm /mnt/root/setup-alpine.sh
        sudo rm /mnt/root/etc/alpine-build-env
        
        # Unmount the bind mounts
        sudo umount /mnt/root/dev/pts 2>/dev/null || true
        sudo umount /mnt/root/dev
        sudo umount /mnt/root/sys
        sudo umount /mnt/root/proc
        
        echo "✓ Alpine base system configured with RasPINE kernel packages"

    - name: Configure networking
      run: |
        # Create resolv configuration
        sudo tee /mnt/root/etc/resolv.conf << 'EOF'
        # RasPINE resolv configuration
        nameserver 8.8.8.8
        nameserver 8.8.4.4
        nameserver 127.0.0.53
        nameserver 127.0.0.1
        EOF
        
        # Network interfaces configuration - minimal, other work over iwd
        sudo tee /mnt/root/etc/network/interfaces << 'EOF'
        auto lo
        iface lo inet loopback
        EOF
        
        echo "✓ Networking configured with dhcpcd and time sync"

    - name: Configure boot partition
      run: |
        # Create fstab
        sudo tee /mnt/root/etc/fstab << 'EOF'
        /dev/mmcblk0p1  /boot           vfat    defaults,noatime                                          0    2
        /dev/mmcblk0p2  /               ext4    defaults,noatime                                          0    1
        tmpfs           /tmp            tmpfs   defaults,noatime,nosuid,nodev,noexec,mode=1777,size=96M   0    0
        tmpfs           /var/tmp        tmpfs   defaults,noatime,nosuid,nodev,mode=1777,size=64M          0    0
        tmpfs           /var/log        tmpfs   defaults,noatime,nosuid,nodev,size=64M                    0    0
        EOF
        
        echo "Kiosk mode: ${ALPINE_KIOSK}"
        
        # Copy boot files from /boot to the actual boot partition
        echo "Copying boot files to boot partition..."
        if [ -d /mnt/root/boot ] && [ "$(ls -A /mnt/root/boot)" ]; then
            echo "Found boot files in /mnt/root/boot, copying to boot partition..."
            sudo rm /mnt/root/boot/boot
            sudo cp -a /mnt/root/boot/* /mnt/boot/
            
            # Verify critical files exist
            if [ ! -f /mnt/boot/cmdline.txt ]; then
                echo "ERROR: cmdline.txt not found - firmware package issue!"
                echo "console=tty1 root=/dev/mmcblk0p2 rootfstype=ext4 fsck.repair=yes rootwait quiet cfg80211.ieee80211_regdom=US" | sudo tee -a /mnt/boot/cmdline.txt > /dev/null
                #exit 1
            fi
            if [ ! -f /mnt/boot/config.txt ]; then
                echo "ERROR: config.txt not found - firmware package issue!"
                echo "kernel=boot/vmlinuz-rpi" | sudo tee -a /mnt/boot/config.txt > /dev/null
                echo "initramfs boot/initramfs-rpi" | sudo tee -a /mnt/boot/config.txt > /dev/null
                echo "arm_64bit=1" | sudo tee -a /mnt/boot/config.txt > /dev/null
                #echo "auto_initramfs=1" | sudo tee -a /mnt/boot/config.txt > /dev/null
            fi
            
            # Fix configuration file
            echo "disable_fw_kms_setup=1" | sudo tee -a /mnt/boot/config.txt > /dev/null
            echo "disable_overscan=1" | sudo tee -a /mnt/boot/config.txt > /dev/null
            echo "dtoverlay=vc4-kms-v3d,noaudio" | sudo tee -a /mnt/boot/config.txt > /dev/null
            echo "max_framebuffers=2" | sudo tee -a /mnt/boot/config.txt > /dev/null
            echo "gpu_mem=64" | sudo tee -a /mnt/boot/config.txt > /dev/null
            echo "temp_limit=75" | sudo tee -a /mnt/boot/config.txt > /dev/null
            echo "dtparam=spi=on" | sudo tee -a /mnt/boot/config.txt > /dev/null
            echo "dtparam=i2c_arm=on" | sudo tee -a /mnt/boot/config.txt > /dev/null
            echo "dtoverlay=i2c-rtc,ds3231" | sudo tee -a /mnt/boot/config.txt > /dev/null
            echo "display_auto_detect=0" | sudo tee -a /mnt/boot/config.txt > /dev/null
            echo "camera_auto_detect=0" | sudo tee -a /mnt/boot/config.txt > /dev/null
            if [ "${ALPINE_KIOSK}" == "true" ]; then
            echo "dtoverlay=vc4-kms-dsi-waveshare-panel-v2,10_1_inch_a" | sudo tee -a /mnt/boot/config.txt > /dev/null
            fi
            # ToDo add cfg80211.ieee80211_regdom=US and dsi display to cmdline.txt
            
            echo "Boot files copied from firmware package:"
            echo "  - config.txt: $(cat /mnt/boot/config.txt)"
            echo "  - cmdline.txt: $(cat /mnt/boot/cmdline.txt)"
        else
            echo "ERROR: No boot files found in /mnt/root/boot - check firmware package!"
            exit 1
        fi
        
        echo "✓ Boot partition configured with files from firmware package"

    - name: Create system information file
      run: |
        sudo tee /mnt/root/etc/raspine-release << EOF
        CFPP-100AC RPi System
        Build Date: ${BUILD_DATE}
        Alpine Version: ${ALPINE_VERSION}
        Architecture: ${ALPINE_ARCH}
        Kernel: Raspberry Pi OS (linux-rpi)
        Userland: Alpine Linux
        EOF

    - name: Cleanup and unmount
      run: |
        # Remove QEMU static binary
        sudo rm -f /mnt/root/usr/bin/qemu-arm-static
        
        # Sync and unmount
        sync
        sudo umount /mnt/boot
        sudo umount /mnt/root
        sudo losetup -d /dev/loop0

    - name: Compress image
      run: |
        echo "Compressing image..."
        xz -9 -T0 raspine.img
        mv raspine.img.xz "RasPINE-${BUILD_DATE}.img.xz"
        
        # Generate checksums
        sha256sum "RasPINE-${BUILD_DATE}.img.xz" > "RasPINE-${BUILD_DATE}.img.xz.sha256"
        
        # Create info file
        cat > "RasPINE-${BUILD_DATE}.info.txt" << EOF
        Alpine Linux for RPi Image
        ====================
        Build Date: ${BUILD_DATE}
        Alpine Version: ${ALPINE_VERSION}
        Architecture: ${ALPINE_ARCH}
        Image Size: $(du -h "RasPINE-${BUILD_DATE}.img.xz" | cut -f1)
        SHA256: $(cut -d' ' -f1 < "RasPINE-${BUILD_DATE}.img.xz.sha256")
        
        Compatible with all Raspberry Pi models.
        EOF

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: RasPINE-${{ env.BUILD_DATE }}
        path: |
          RasPINE-*.img.xz
          RasPINE-*.img.xz.sha256
          RasPINE-*.info.txt
        retention-days: 90

    - name: Create Release
      # Only create release if called directly (not from master workflow)
      if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/linux-rpi'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.BUILD_DATE }}
        name: Alpine Linux for RPi ${{ env.BUILD_DATE }}
        draft: false
        prerelease: false
        files: |
          RasPINE-*.img.xz
          RasPINE-*.img.xz.sha256
          RasPINE-*.info.txt
        body: |
          # Image - ${{ env.BUILD_DATE }}
          
          Alpine Linux ${{ env.ALPINE_VERSION }}.
          
          ## Download
